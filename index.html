<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Danish Shop</title>
    
    <!-- Google Fonts & Tailwind -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F8FAFC; }
        h1, h2, h3 { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-panel { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="text-slate-800 antialiased h-screen flex flex-col">

    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="fixed inset-0 bg-[#0F172A] z-50 flex items-center justify-center p-4 transition-opacity duration-300">
        <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-sm text-center">
            <div class="bg-[#0284C7] w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
                <i data-lucide="lock" class="text-white w-8 h-8"></i>
            </div>
            <h2 class="text-2xl font-bold text-slate-800 mb-2">Admin Akses</h2>
            <p class="text-slate-500 text-sm mb-6">Masukkan password untuk mengelola katalog.</p>
            
            <input type="password" id="adminPassword" placeholder="Password Admin..." class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-[#0284C7] focus:ring-2 focus:ring-[#0284C7]/20 outline-none mb-4 text-center font-bold tracking-widest">
            
            <button onclick="loginAdmin()" id="btnLogin" class="w-full bg-[#0F172A] hover:bg-[#0284C7] text-white font-bold py-3 rounded-xl transition">
                Masuk Dashboard
            </button>
            <p id="loginError" class="text-red-500 text-sm mt-3 hidden font-medium"></p>
        </div>
    </div>

    <!-- DASHBOARD NAVBAR -->
    <nav class="bg-[#0F172A] text-white py-4 px-6 shadow-md flex justify-between items-center hidden" id="adminNav">
        <div class="flex items-center gap-3">
            <i data-lucide="cpu" class="text-[#FACC15]"></i>
            <h1 class="font-bold text-lg tracking-wide">DANISH<span class="text-[#0284C7]">ADMIN</span></h1>
        </div>
        <button onclick="logoutAdmin()" class="bg-white/10 hover:bg-white/20 text-white text-sm px-4 py-2 rounded-lg transition flex items-center gap-2">
            <i data-lucide="log-out" class="w-4 h-4"></i> Keluar
        </button>
    </nav>

    <!-- MAIN DASHBOARD CONTENT -->
    <main class="flex-grow p-6 hidden flex-col" id="adminMain">
        <div class="max-w-6xl mx-auto w-full">
            
            <!-- Header & Stats -->
            <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
                <div>
                    <h2 class="text-2xl font-bold text-slate-800">Kelola Katalog Produk</h2>
                    <p class="text-slate-500 text-sm mt-1">Tambah, edit, atau hapus layanan di website utama.</p>
                </div>
                <button onclick="openModal()" class="bg-[#0284C7] hover:bg-[#0369A1] text-white px-5 py-2.5 rounded-xl font-semibold shadow-lg shadow-[#0284C7]/30 flex items-center gap-2 transition">
                    <i data-lucide="plus" class="w-5 h-5"></i> Tambah Produk Baru
                </button>
            </div>

            <!-- Data Table -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-50 text-slate-500 text-sm border-b border-slate-200">
                                <th class="py-3 px-4 font-semibold">ID</th>
                                <th class="py-3 px-4 font-semibold">Nama Produk/Layanan</th>
                                <th class="py-3 px-4 font-semibold">Kategori</th>
                                <th class="py-3 px-4 font-semibold">Harga</th>
                                <th class="py-3 px-4 font-semibold">Status</th>
                                <th class="py-3 px-4 font-semibold text-center">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody" class="text-sm">
                            <tr>
                                <td colspan="6" class="text-center py-8 text-slate-400">Loading data dari Google Sheets...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- MODAL TAMBAH PRODUK -->
    <div id="addModal" class="fixed inset-0 bg-black/60 z-[60] hidden items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl w-full max-w-lg overflow-hidden shadow-2xl transform transition-all">
            <div class="bg-[#0F172A] px-6 py-4 flex justify-between items-center">
                <h3 class="text-white font-bold text-lg">Tambah Produk Baru</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            
            <form id="addForm" class="p-6 space-y-4" onsubmit="submitProduct(event)">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Nama Produk / Layanan *</label>
                    <input type="text" id="inpNama" required class="w-full px-3 py-2 rounded-lg border focus:ring-2 focus:ring-[#0284C7] outline-none">
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Kategori *</label>
                        <select id="inpKategori" required class="w-full px-3 py-2 rounded-lg border focus:ring-2 focus:ring-[#0284C7] outline-none bg-white">
                            <option value="digital">Digital & Custom</option>
                            <option value="software">Software Original</option>
                            <option value="hardware">Laptop & Hardware</option>
                            <option value="servis">Jasa Servis</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Status *</label>
                        <select id="inpStatus" required class="w-full px-3 py-2 rounded-lg border focus:ring-2 focus:ring-[#0284C7] outline-none bg-white">
                            <option value="Tersedia">Tersedia</option>
                            <option value="Bisa Custom">Bisa Custom</option>
                            <option value="Konsultasi">Konsultasi</option>
                            <option value="Stok Habis">Stok Habis</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Harga Tampil *</label>
                    <input type="text" id="inpHarga" required placeholder="Contoh: Mulai Rp 150.000" class="w-full px-3 py-2 rounded-lg border focus:ring-2 focus:ring-[#0284C7] outline-none">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Deskripsi Singkat *</label>
                    <textarea id="inpDeskripsi" required rows="3" class="w-full px-3 py-2 rounded-lg border focus:ring-2 focus:ring-[#0284C7] outline-none"></textarea>
                </div>

                <div class="pt-4 border-t border-slate-100 flex justify-end gap-2">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 text-slate-500 font-semibold hover:bg-slate-100 rounded-lg">Batal</button>
                    <button type="submit" id="btnSubmit" class="px-5 py-2 bg-[#0284C7] hover:bg-[#0369A1] text-white font-semibold rounded-lg flex items-center gap-2">
                        Simpan Produk
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- SCRIPT LOGIC -->
    <script>
        lucide.createIcons();

        const GAS_URL = "URL_WEB_APP_GAS_ANDA_DISINI"; // GANTI DENGAN URL WEB APP GAS ANDA
        let activePassword = "";

        // UI Toggles
        const loginScreen = document.getElementById('loginScreen');
        const adminNav = document.getElementById('adminNav');
        const adminMain = document.getElementById('adminMain');
        const loginError = document.getElementById('loginError');

        function loginAdmin() {
            const pass = document.getElementById('adminPassword').value;
            const btn = document.getElementById('btnLogin');
            
            if(!pass) return;
            
            // Animasi Loading
            btn.innerHTML = "Memverifikasi...";
            btn.disabled = true;

            // Uji ambil data katalog sekalian untuk cek koneksi
            fetch(GAS_URL)
                .then(res => res.json())
                .then(data => {
                    // Karena verifikasi pass asli ada di backend saat POST, kita simpan pass di memori
                    // Jika password salah saat request POST (Tambah/Hapus), sistem akan menolak
                    activePassword = pass;
                    
                    loginScreen.classList.add('opacity-0', 'pointer-events-none');
                    setTimeout(() => {
                        loginScreen.classList.add('hidden');
                        adminNav.classList.remove('hidden');
                        adminMain.classList.remove('hidden');
                        adminMain.classList.add('flex');
                        loadTableData(data.data.katalog);
                    }, 300);
                })
                .catch(err => {
                    loginError.innerText = "Gagal terhubung ke server.";
                    loginError.classList.remove('hidden');
                })
                .finally(() => {
                    btn.innerHTML = "Masuk Dashboard";
                    btn.disabled = false;
                });
        }

        function logoutAdmin() {
            activePassword = "";
            document.getElementById('adminPassword').value = "";
            adminNav.classList.add('hidden');
            adminMain.classList.add('hidden');
            adminMain.classList.remove('flex');
            loginScreen.classList.remove('hidden', 'opacity-0', 'pointer-events-none');
        }

        // Render Table
        function loadTableData(katalogArray) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            if(!katalogArray || katalogArray.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center py-6 text-slate-400">Belum ada data produk.</td></tr>';
                return;
            }

            // Urutkan dari yang terbaru (asumsi ID mengandung timestamp atau baris terbawah)
            katalogArray.reverse().forEach(item => {
                let badgeColor = item.Status.includes('Custom') ? 'bg-blue-100 text-blue-700' : 
                                (item.Status.includes('Habis') ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700');
                
                tbody.innerHTML += `
                    <tr class="border-b border-slate-100 hover:bg-slate-50 transition">
                        <td class="py-3 px-4 text-xs font-mono text-slate-400">${item.ID.toString().substring(0, 10)}...</td>
                        <td class="py-3 px-4 font-medium text-slate-800">${item.Nama_Item}</td>
                        <td class="py-3 px-4 text-sm text-slate-500 uppercase">${item.Kategori}</td>
                        <td class="py-3 px-4 text-sm font-semibold text-[#0284C7]">${item.Harga}</td>
                        <td class="py-3 px-4"><span class="px-2 py-1 text-xs font-bold rounded ${badgeColor}">${item.Status}</span></td>
                        <td class="py-3 px-4 text-center">
                            <button onclick="deleteProduct('${item.ID}', '${item.Nama_Item}')" class="text-red-500 hover:text-red-700 hover:bg-red-50 p-2 rounded-lg transition" title="Hapus Produk">
                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                            </button>
                        </td>
                    </tr>
                `;
            });
            lucide.createIcons();
        }

        // Modal Logic
        const modal = document.getElementById('addModal');
        function openModal() { modal.classList.remove('hidden'); modal.classList.add('flex'); }
        function closeModal() { modal.classList.add('hidden'); modal.classList.remove('flex'); document.getElementById('addForm').reset(); }

        // Tambah Data (POST)
        function submitProduct(e) {
            e.preventDefault();
            const btnSubmit = document.getElementById('btnSubmit');
            btnSubmit.innerHTML = "Menyimpan..."; btnSubmit.disabled = true;

            const payload = {
                password: activePassword,
                action: "add",
                nama: document.getElementById('inpNama').value,
                kategori: document.getElementById('inpKategori').value,
                status: document.getElementById('inpStatus').value,
                harga: document.getElementById('inpHarga').value,
                deskripsi: document.getElementById('inpDeskripsi').value
            };

            fetch(GAS_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain" },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === "success") {
                    alert("Sukses: " + data.message);
                    closeModal();
                    refreshTable(); // Refresh tabel setelah tambah
                } else {
                    alert("Gagal: " + data.message); // Biasanya karena password salah
                }
            })
            .catch(err => alert("Terjadi kesalahan sistem."))
            .finally(() => { btnSubmit.innerHTML = "Simpan Produk"; btnSubmit.disabled = false; });
        }

        // Hapus Data (POST)
        function deleteProduct(id, nama) {
            if(!confirm(`Yakin ingin menghapus produk:\n"${nama}" ?\n\nAksi ini tidak dapat dibatalkan.`)) return;

            const payload = {
                password: activePassword,
                action: "delete",
                id: id
            };

            // Loading state on cursor
            document.body.style.cursor = 'wait';

            fetch(GAS_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain" },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === "success") {
                    alert("Produk berhasil dihapus!");
                    refreshTable();
                } else {
                    alert("Gagal: " + data.message);
                }
            })
            .catch(err => alert("Terjadi kesalahan sistem."))
            .finally(() => { document.body.style.cursor = 'default'; });
        }

        // Refresh Data API
        function refreshTable() {
            document.getElementById('tableBody').innerHTML = '<tr><td colspan="6" class="text-center py-6 text-slate-400">Memperbarui data...</td></tr>';
            fetch(GAS_URL)
                .then(res => res.json())
                .then(data => loadTableData(data.data.katalog));
        }
    </script>
</body>
</html>
